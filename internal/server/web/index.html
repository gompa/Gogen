<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoGen AI Agent</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div id="top-tabs">
        <button type="button" class="main-tab active" data-pane="chat">Chat</button>
        <button type="button" class="main-tab" data-pane="editor">Editor</button>
        <span id="global-mode-badge" title="Global mode active — agent is not scoped to working directory">🌐 Global</span>
        <span id="conn-indicator" class="disconnected" title="Disconnected" role="status" aria-live="polite" aria-label="Disconnected"></span>
        <button type="button" id="settings-btn" title="Settings">⚙</button>
    </div>
    <div id="main-panes">
        <div id="chat-pane" class="pane active">
            <div id="sidebar">
                <h3>Configuration</h3>
                <label>Working Directory:</label>
                <input type="text" id="working-dir-input" placeholder="/path/to/dir">
                <button id="set-dir-btn">Set Working Directory</button>
                <hr>
                <!-- Hidden references for toolbar JS — do not remove -->
                <div style="display:none">
                    <div id="model-info"></div>
                    <select id="model-select"></select>
                    <div id="thinking-info"></div>
                    <div id="context-info"><span id="context-text"></span></div>
                    <div id="context-bar-wrap"><div id="context-bar"></div></div>
                    <div id="mode-btns">
                        <button type="button" id="mode-act-btn"></button>
                        <button type="button" id="mode-plan-btn"></button>
                    </div>
                    <div id="session-info" style="display:none"></div>
                </div>
                <div id="session-actions">
                    <button type="button" id="session-new-btn" title="Start a new session">New</button>
                    <button type="button" id="export-chat-btn" title="Export chat as markdown">Export</button>
                </div>
                <div id="session-list" aria-label="Saved sessions"></div>
            </div>
            <div id="chat-container">
                <button type="button" id="sidebar-toggle" title="Toggle sidebar">☰</button>
                <div id="messages" tabindex="-1"></div>
                <button type="button" id="scroll-bottom-btn">↓ New messages</button>
                <div id="composer-toolbar">
                    <div id="tb-model-picker" class="tb-group">
                        <button type="button" id="tb-model-btn" class="tb-btn" title="Select model">— <span class="tb-arrow">▾</span></button>
                        <div id="tb-model-popover" class="tb-popover">
                            <div class="tb-popover-section">
                                <div class="tb-popover-heading">Model</div>
                                <div id="tb-model-list" class="tb-model-list"></div>
                            </div>
                            <div class="tb-popover-section">
                                <div class="tb-popover-heading">Thinking level</div>
                                <div id="tb-thinking-grid" class="tb-thinking-grid"></div>
                            </div>
                        </div>
                    </div>
                    <div id="tb-mode-picker" class="tb-group">
                        <button type="button" id="tb-mode-btn" class="tb-btn">📝 Coding <span class="tb-arrow">▾</span></button>
                        <div id="tb-mode-popover" class="tb-popover">
                            <div class="tb-popover-section">
                                <div class="tb-popover-heading">Mode</div>
                                <div id="tb-mode-list" class="tb-model-list">
                                    <button type="button" class="tb-model-row" data-mode="act">Act</button>
                                    <button type="button" class="tb-model-row" data-mode="plan">Plan</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div id="tb-context-group" class="tb-group">
                        <span id="tb-context-badge" class="tb-context-badge" role="status">—</span>
                        <div id="context-tooltip"></div>
                    </div>
                </div>
                <div id="input-area">
                    <div id="input-wrap">
                        <div id="slash-suggest" role="listbox" aria-label="Slash command suggestions"></div>
                        <textarea id="message-input" placeholder="Ask the agent... (type / for commands, Enter to send, Shift+Enter for newline)" autofocus autocomplete="off" rows="1"></textarea>
                        <div id="input-progress">
                            <div class="progress-spinner"></div>
                            <span class="progress-label"></span>
                        </div>
                    </div>
                    <button id="send-btn">Send</button>
                    <button id="cancel-btn" disabled title="Cancel current turn">Cancel</button>
                </div>
            </div>
        </div>
        <div id="editor-pane" class="pane">
            <div id="editor-sidebar">
                <div id="find-in-files-wrap">
                    <div id="find-in-files-header">
                        <label for="find-in-files-input">Find in files</label>
                        <button type="button" id="btn-toggle-replace" title="Toggle replace (Ctrl+Shift+H)">Replace ▾</button>
                    </div>
                    <input type="search" id="find-in-files-input" placeholder="Search codebase…" autocomplete="off">
                    <div id="find-in-files-replace-row">
                        <input type="text" id="find-in-files-replace-input" placeholder="Replace…" autocomplete="off">
                        <div id="replace-buttons-row">
                            <button type="button" id="btn-replace-one" title="Replace in current file only">Replace</button>
                            <button type="button" id="btn-replace-all" class="primary" title="Replace all matches across all files">Replace All</button>
                        </div>
                    </div>
                    <div id="find-in-files-results"></div>
                </div>
                <h4>Files <button type="button" id="btn-refresh-explorer">Refresh</button></h4>
                <div id="file-tree"></div>
                <div id="unstaged-wrap">
                    <h4>Unstaged changes</h4>
                    <div id="unstaged-list"></div>
                </div>
            </div>
            <div id="editor-main">
                <div id="editor-toolbar">
                    <span id="editor-path-label">No file open</span>
                    <button type="button" id="btn-undo" title="Undo (Ctrl+Z)" disabled>Undo</button>
                    <button type="button" id="btn-redo" title="Redo (Ctrl+Shift+Z)" disabled>Redo</button>
                    <button type="button" id="btn-diff-layout" title="Toggle DiffEditor side-by-side vs inline">Side-by-side</button>
                    <button type="button" id="btn-save-file">Save</button>
                    <button type="button" id="btn-save-all">Save all</button>
                    <span id="save-all-loading">Saving…</span>
                </div>
                <div id="editor-tabs"></div>
                <div id="monaco-wrap">
                    <div id="monaco-host"></div>
                    <div id="monaco-diff-host"></div>
                </div>
            </div>
        </div>
    </div>
    <div id="delete-approval-overlay">
        <div id="delete-approval-dialog">
            <h3>Approve file delete?</h3>
            <p id="delete-approval-reason"></p>
            <div id="delete-approval-paths"></div>
            <div id="delete-approval-actions">
                <button class="deny" id="delete-deny-btn">Deny</button>
                <button class="allow" id="delete-allow-btn">Allow delete</button>
            </div>
        </div>
    </div>
    <div id="close-tab-overlay">
        <div id="close-tab-dialog">
            <h3>Discard unsaved changes?</h3>
            <p id="close-tab-filename"></p>
            <div id="close-tab-actions">
                <button class="keep" id="close-tab-keep-btn">Keep editing</button>
                <button class="discard" id="close-tab-discard-btn">Discard &amp; close</button>
            </div>
        </div>
    </div>
    <div id="replace-preview-overlay">
        <div id="replace-preview-dialog">
            <h3>Replace Preview</h3>
            <div id="replace-preview-summary"></div>
            <div id="replace-preview-body"></div>
            <div id="replace-preview-actions">
                <button id="rp-cancel">Cancel</button>
                <button id="rp-confirm">Confirm Replace</button>
            </div>
        </div>
    </div>
    <div id="settings-overlay">
        <div id="settings-dialog" role="dialog" aria-label="Settings">
            <h3>Settings</h3>
            <div class="setting-row">
                <div>
                    <label>Theme</label>
                    <select id="theme-select" aria-label="Theme">
                        <option value="auto">Auto (system)</option>
                        <option value="dark">Dark</option>
                        <option value="light">Light</option>
                    </select>
                </div>
            </div>
            <div class="setting-row">
                <div>
                    <label>Click file in chat</label>
                    <select id="file-click-behavior" aria-label="File click behavior">
                        <option value="open">Open (background)</option>
                        <option value="open-switch">Open &amp; switch to editor</option>
                    </select>
                </div>
            </div>
            <div class="setting-row">
                <div>
                    <label>Desktop notifications</label>
                    <select id="notifications-select" aria-label="Desktop notifications">
                        <option value="off">Off</option>
                        <option value="background">When tab is hidden</option>
                        <option value="always">Always</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
    <div id="command-palette-overlay" aria-hidden="true">
        <div id="command-palette" role="dialog" aria-label="Command palette">
            <input type="text" id="command-palette-input" placeholder="Type a command…" autocomplete="off">
            <div id="command-palette-list" role="listbox"></div>
        </div>
    </div>
    <div id="toast-host" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
</body>
</html>
